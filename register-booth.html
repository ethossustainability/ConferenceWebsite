<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booth Registration - The Circular Economy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo-container">
                <img src="EthosLogoInsignia.png" alt="Ethos Insignia" class="nav-insignia">
                <span class="logo">Ethos Sustainability</span>
            </a>
            <div class="nav-actions">
                <a href="register-student.html" class="btn btn-outline btn-nav">Register as Student</a>
                <a href="register-booth.html" class="btn btn-primary btn-nav">Register Your Company</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero" style="min-height: 30vh; padding-top: 8rem; padding-bottom: 2rem;">
            <div class="container">
                <h1 class="animate">Secure Your Booth</h1>
                <p class="animate delay-1">Connect with 1,000+ motivated students and sustainable leaders.</p>
            </div>
        </section>

        <section class="container" style="padding-bottom: 6rem;">
            <div class="form-container animate delay-2">
                <iframe
                    src="https://docs.google.com/forms/d/e/1FAIpQLSdkzVNG8MFuXXUzsRiZLFkMCLP-uz7arCccJrkt94ldr0fmOA/viewform?embedded=true"
                    width="640" height="1167" frameborder="0" marginheight="0" marginwidth="0"
                    style="width: 100%; max-width: 640px; margin: 0 auto; display: block;">Loading…</iframe>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-brand">The Circular Economy: From Youth to Industry</div>
            <p class="footer-text">© 2026 Ethos Sustainable Business and STEAM Education</p>
        </div>
    </footer>
</body>

</html>
