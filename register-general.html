<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Registration - Sustainable Conference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-placeholder {
            min-height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            border-radius: 12px;
            border: 2px dashed var(--border);
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">Ethos Sustainability</a>
        </div>
    </nav>

    <main>
        <section class="hero" style="min-height: 30vh; padding-top: 8rem; padding-bottom: 2rem;">
            <div class="container">
                <h1 class="animate">General Attendee Registration</h1>
                <p class="animate delay-1">Please complete the form below to secure your spot.</p>
            </div>
        </section>

        <section class="container" style="padding-bottom: 6rem;">
            <div class="form-container animate delay-2">
                <!-- Google Form Embed Placeholder -->
                <div class="form-placeholder">
                    <p>Google Form Embed Area (Coming Soon)</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-brand">Ethos Sustainability</div>
            <p class="footer-text">© 2026 Ethos Sustainable Business and STEAM Education</p>
        </div>
    </footer>
</body>

</html>
